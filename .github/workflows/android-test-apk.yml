name: Build Ride Garage Android test APK
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      # Use the Android SDK preinstalled on GitHub's Ubuntu runner.
      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_SDK_ROOT:-$ANDROID_HOME}" >> "$GITHUB_ENV"
          yes | sdkmanager --licenses >/dev/null || true
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Prepare Ride Garage site
        run: npm run prepare:web
      - name: Generate Android project
        run: npx cap add android
      - name: Generate branded Android assets
        run: |
          mkdir -p assets
          cp icon.png assets/icon.png
          cp splash.png assets/splash.png
          npx capacitor-assets generate --android
      - name: Build APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Ride-Garage-Android-TEST-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
